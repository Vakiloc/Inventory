version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/inventory-app"
    target-branch: "develop-claude"
    schedule:
      interval: "weekly"
    groups:
      server-deps:
        patterns:
          - "express"
          - "zod"
          - "better-sqlite3"
          - "cors"
          - "@simplewebauthn/*"
          - "googleapis"
          - "@google-cloud/*"
      build-tools:
        patterns:
          - "vite"
          - "vitest"
          - "electron"
          - "electron-builder"
          - "@electron/*"
          - "concurrently"
          - "cross-env"
          - "wait-on"
      capacitor:
        patterns:
          - "@capacitor/*"
          - "@capacitor-mlkit/*"
      testing:
        patterns:
          - "supertest"
          - "jsdom"
          - "@testing-library/*"
  - package-ecosystem: "gradle"
    directory: "/inventory-app/android"
    target-branch: "develop-claude"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 32
    groups:
      androidx:
        patterns:
          - "androidx.*"
      square:
        patterns:
          - "com.squareup.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlinx*"
      testing:
        patterns:
          - "org.mockito*"
          - "junit*"
