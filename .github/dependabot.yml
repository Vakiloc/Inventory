version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/inventory-app"
    target-branch: "develop-claude"
    schedule:
      interval: "weekly"
    # Group npm workspace updates to reduce PR count
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gradle"
    directory: "/inventory-app/android"
    target-branch: "develop-claude"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 32
    groups:
      androidx:
        patterns:
          - "androidx.*"
      square:
        patterns:
          - "com.squareup.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlinx*"
      testing:
        patterns:
          - "org.mockito*"
          - "junit*"
